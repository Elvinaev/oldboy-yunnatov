<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OldBoy Юннатов — Оставить отзыв</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #111111;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .address {
      color: #a5a5a5;
      font-size: 15px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 27px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px 20px;
      margin: 15px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.2s;
    }

    .button:active {
      transform: scale(0.98);
    }

    .yandex {
      background: #ffffff;
      color: #111111;
    }

    .gis {
      background: #1f9d55;
      color: #ffffff;
    }

    .footer {
      margin-top: 35px;
      color: #777777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">OldBoy</div>

    <div class="address">
      Юннатов,4Г · Москва
    </div>

    <h1>Нам важно ваше мнение ❤️</h1>

    <div class="subtitle">
      Спасибо, что посетили OldBoy Юннатов!<br>
      Пожалуйста, оставьте отзыв о вашем визите.
    </div>

    <a
      class="button yandex"
      href="https://yandex.ru/maps/org/oldboy/78788957128?si=71xk6pw8z4uhyw11ftmx1r6604"
      target="_blank"
    >
      ⭐ Оставить отзыв в Яндекс Картах
    </a>

    <a
      class="button gis"
      href="https://2gis.ru/moscow/geo/70000001052487997"
      target="_blank"
    >
      📍 Оставить отзыв в 2ГИС
    </a>

    <div class="footer">
      Спасибо, что выбираете OldBoy Юннатов ✂️
    </div>

  </div>

</body>
</html>
